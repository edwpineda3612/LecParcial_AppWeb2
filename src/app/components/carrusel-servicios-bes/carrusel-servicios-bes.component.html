    <div class="overflow-x-auto py-4">
      <h2 class="text-2xl font-bold mb-4">Catálogo de Servicios</h2>
      <div class="flex space-x-4 w-max">
        @for (serviciobes of servicios_bes; track $index) {
          <div class="bg-white rounded-lg shadow-md w-80  flex-shrink-0">
            <!--<img [src]="serviciobes.imagen_url_serv" [alt]="serviciobes.nombre_serv" class="w-full h-40 object-cover rounded-t-lg">-->
            <img class="imagen_servicios" src="{{serviciobes.imagen_url_serv}}" alt="{{serviciobes.nombre_serv}}">
            
            <div class="p-4">
              <h3 class="text-lg font-semibold text-gray-900 mb-2">{{serviciobes.nombre_serv}}</h3>
              <p class="text-gray-700 text-sm mb-2">{{serviciobes.descripcion_serv}}.</p>
              <p class="text-md font-bold text-green-600">${{serviciobes.precio_serv}}</p>
              <!--<button class="mt-2 bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-3 rounded focus:outline-none focus:shadow-outline">Más Info</button>-->
              @if  ((user?.email === 'epineda@bestenergy.com.ec') || (user?.email === 'gochoa@user-bestenergy.com.ec'))
              {
              <button [routerLink]="['/servicios', serviciobes.id]" type="button" class="py-2.5 px-5 me-2 mb-2 text-sm font-medium text-gray-900 focus:outline-none bg-red rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-red-700">Editar Servicio</button>
              <button (click)="eliminarservicio(serviciobes.id)" type="button" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Eliminar Servicio</button>
              }
            </div>
            <!--<a href="#">
                <img class="foto" src="{{serviciobes.imagen_url_serv}}" alt="{{serviciobes.nombre_serv}}">
            </a>-->
          </div>
        }
      </div>
    </div>
